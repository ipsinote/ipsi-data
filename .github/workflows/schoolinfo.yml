name: 학교알리미 받기(사립·국립 초등학교 학생 수)

# 2026-11-22 대표가 학교알리미 Open API 키를 받아 비밀 값 SCHOOLINFO_KEY에 넣음 · 18:10 대표 '둘 다'(학교 규모 자료 줄 + 맞춰 보기).
# 저장은 사립·국립 초등학교만(data/schoolinfo/) · 키는 로그에서 가림 · 화면에 쓸 때 출처 '학교알리미(한국교육학술정보원)'.
on:
  schedule:
    - cron: '23 20 1 * *'   # 매달 2일 05:23(한국 시간) — 키 점검(ping): 서울 종로구 하나만 불러 키가 살아 있는지 보고, 공시연도·표본이 바뀌었으면 그때만 전체를 다시 받음
  workflow_dispatch:
    inputs:
      mode:
        description: 'diag = 응답 모양만(저장 안 함) · run = 받아서 저장 · ping = 키 점검(시·군·구 하나)'
        required: false
        default: 'diag'
  push:
    branches: [main]
    paths: ['scripts/fetch_schoolinfo.py', '.github/workflows/schoolinfo.yml']

permissions:
  contents: write

concurrency:
  group: schoolinfo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 엑셀 읽기 도구
        run: pip install -q openpyxl==3.1.5
      - name: 학교알리미 부르기
        env:
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          MODE: ${{ github.event_name == 'schedule' && 'ping' || github.event.inputs.mode || 'diag' }}
        run: python scripts/fetch_schoolinfo.py "$MODE"
      - name: 바뀐 것이 있으면 저장
        if: always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'run' || github.event.inputs.mode == 'ping')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schoolinfo || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "학교알리미 학교 현황 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase --autostash || true
            git push
          fi
