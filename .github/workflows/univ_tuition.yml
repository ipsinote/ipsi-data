name: 대학별 평균등록금 받기(한국장학재단 · 공공데이터포털 파일)

# 2026-11-25 실행 1 창 — 입시노트 운영실 카드 '등록금 받는 길' ②(대표 0분 · 키 필요 없음 — 로그인 없이 내려받는 파일).
# 해마다 한 번(포털 차기 등록 예정 2027-05-31) → 달마다 2일에 쪽의 '고친 때'만 보고, 그대로면 받지 않음.
on:
  schedule:
    - cron: '17 21 1 * *'    # 매달 2일 06:17(한국 시간) = 1일 21:17(UTC)
  workflow_dispatch:
  push:   # 받는 도구를 고쳐 올리면 한 번 돌려 확인(깃허브 화면을 못 여는 작업 창용)
    branches: [main]
    paths: ['scripts/fetch_tuition.py', '.github/workflows/univ_tuition.yml']

permissions:
  contents: write

concurrency:
  group: univ_tuition
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 평균등록금 받기
        run: python scripts/fetch_tuition.py
      - name: 바뀐 것이 있으면 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/univ_tuition || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "평균등록금 갱신 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase --autostash || true
            git push
          fi
