name: 공식 누리집 robots 판정(파일)

# 2026-11-23 대표 대화 버튼 'A 깃허브가 읽고 예약은 결과 파일만'(운영실 asks/ask-dec-permwait-1123):
#   예약(무인) 실행이 robots.txt를 웹 열기로 열다 허락 대기로 멈추던 것(11/17~11/20 낮 작업 4번)을 없앰.
#   깃허브가 매일 robots.txt를 읽어 '우리 이름'에 걸리는 규칙만 data/robots_status.json에 남기고,
#   예약·대화 창은 이 파일만 받아 ipsi-site tools/robots_allow.py로 판정한다.
# 낮 작업(09:47·13:47 한국 시간) 전에 끝나게 두 번(08:17·12:17) — 깃허브 예약은 늦거나 빠질 수 있음.
on:
  schedule:
    - cron: '17 23 * * *'   # 매일 오전 8시 17분(한국 시간)
    - cron: '17 3 * * *'    # 매일 낮 12시 17분(한국 시간)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['watch/robots_hosts.json', 'scripts/robots_status.py']

permissions:
  contents: write

concurrency:
  group: robots
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 도구 설치
        run: pip install requests beautifulsoup4 lxml pdfminer.six olefile
      - name: 판정 점검(네트워크 없음)
        run: python scripts/test_robots_status.py
      - name: robots.txt 읽기(우리 이름·* 규칙만 남김)
        run: python scripts/robots_status.py data/robots_status.json
      - name: 바뀐 것이 있으면 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/robots_status.json || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "robots 판정 $(TZ=Asia/Seoul date '+%F %H:%M')"
            git pull --rebase -q || true
            git push
          fi
